[package]
authors = ["Gu ZhenNiu <448885@qq.com>", "Zhang Zhenyuan <cryscan@umich.edu>"]
categories = ["science", "artificial-intelligence"] 
description = "OpenCog Hyperon integration for RWKV AI00 Server"
edition.workspace = true
homepage = "https://github.com/cgisky1980/ai00_rwkv_server"
keywords = ["LLM", "deep-learning", "model", "rwkv", "opencog", "hyperon"]
license.workspace = true
name = "ai00-opencog"
repository = "https://github.com/cgisky1980/ai00_rwkv_server"
rust-version.workspace = true
version.workspace = true

[dependencies]
# OpenCog Hyperon dependencies
hyperon = { git = "https://github.com/trueagi-io/hyperon-experimental.git", version = "0.2.8", default-features = false, features = ["pkg_mgmt"] }
hyperon-space = { git = "https://github.com/trueagi-io/hyperon-experimental.git", version = "0.2.8" }
hyperon-atom = { git = "https://github.com/trueagi-io/hyperon-experimental.git", version = "0.2.8" }

# Workspace dependencies
anyhow.workspace = true
derivative.workspace = true
flume.workspace = true
itertools.workspace = true
log.workspace = true
serde.workspace = true
tokio.workspace = true

# Additional dependencies
uuid = { version = "1.8.0", features = ["serde", "v4"] }
serde_json = "1.0"

[dependencies.salvo]
features = ["oapi"]
workspace = true

[features]
default = []
# Optional features can be added here for different OpenCog capabilities
pattern-matching = []
reasoning = []